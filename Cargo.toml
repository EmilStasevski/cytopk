[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EmilStasevski/cytopk"
publish = false

[workspace.dependencies]
ndarray = { version = "0.17.2", features = ["rayon"] }
rayon = "1.12.0"
thiserror = "2.0.21"
# dev
proptest = "1.12.0"
rand = "0.10.3"
rand_chacha = "0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
