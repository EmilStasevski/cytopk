name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml and installs the pinned toolchain + components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: build extension
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin==1.16.0 numpy pytest
          cd python && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" ../.venv/bin/maturin develop --release
      - name: pytest
        run: .venv/bin/python -m pytest -q python/tests
